name: Playwright Tests

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }

      - run: npm ci

      # Fast checks first: no point starting browsers if the code does not compile.
      - run: npm run lint
      - run: npm run typecheck

      - run: npx playwright install --with-deps chrome msedge ffmpeg

      # Allure history from earlier runs on this branch (or main): trend charts and flaky markers.
      - uses: actions/cache/restore@v6
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-main-

      # URLs are not secret, so they are repository variables.
      # Credentials are secrets: masked in logs and never written in this file.
      # Set both in GitHub > Settings > Secrets and variables > Actions.
      - run: npx playwright test
        env:
          SAUCE_BASE_URL: ${{ vars.SAUCE_BASE_URL }}
          INTERNET_BASE_URL: ${{ vars.INTERNET_BASE_URL }}
          BOOKER_API_URL: ${{ vars.BOOKER_API_URL }}
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          BOOKER_USER: ${{ secrets.BOOKER_USER }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
          # Pull requests fail when a locator needed healing; main only reports it.
          SELF_HEALING: ${{ github.event_name == 'pull_request' && 'fail' || 'report' }}

      # On failure, print a summary of failures by cause in the job log.
      - run: npm run triage
        if: ${{ failure() }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
          retention-days: 14

      # Skipped when lint or typecheck failed and no test ran.
      - run: npx allure generate allure-results
        if: ${{ !cancelled() && hashFiles('allure-results/**') != '' }}

      # cache/save instead of actions/cache, so a failed run is kept in the history too.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('allure-history/**') != '' }}
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      # A single index.html: download, unzip, open in a browser.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('allure-report/**') != '' }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
